name: Deploy Preview to Railway

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  # Needed to post the preview URL comment on pull requests.
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  create-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Optional repository variable PREVIEW_TRUSTED_AUTHORS: JSON array of GitHub
    # usernames, e.g. ["username"]. Adds to owner/member/collaborator trust.
    # Trust the PR author, regardless of who triggers a workflow update.
    environment: >-
      ${{ (github.event.pull_request.user.login == github.repository_owner
          || github.event.pull_request.author_association == 'MEMBER'
          || github.event.pull_request.author_association == 'COLLABORATOR'
          || contains(fromJSON(vars.PREVIEW_TRUSTED_AUTHORS || '[]'), github.event.pull_request.user.login))
          && 'preview-cleanup' 
          || 'preview-deploy' }}
    steps:
      - name: Determine deploy branch
        id: branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "name=railway-preview/pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=${HEAD_REF}" >> "$GITHUB_OUTPUT"
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted controller (fork)
        if: steps.branch.outputs.is_fork == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Push to trackable branch (fork)
        if: steps.branch.outputs.is_fork == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fetched_sha=$(git rev-parse FETCH_HEAD)
          if [ "$fetched_sha" != "$EXPECTED_SHA" ]; then
            echo "PR changed after this run was requested; use the newer run."
            exit 1
          fi
          git push origin "${EXPECTED_SHA}:refs/heads/railway-preview/pr-${PR_NUMBER}" --force

      - name: Deploy to Railway
        id: railway-deploy
        uses: ayungavis/railway-preview-deploy@8f821daf4bab3ba5bfd0e8b9d3408aed202610d7 # v2.0.0
        with:
          railway_api_token: ${{ secrets.RAILWAY_TOKEN }}
          project_id: ${{ vars.RAILWAY_PROJECT_ID }}
          environment_name: "preview-deploy"
          preview_environment_name: "pr-${{ github.event.pull_request.number }}"
          deployment_mode: commit
          commit_sha: ${{ github.event.pull_request.head.sha }}
          api_service_name: atmosphereconf-2027
          branch_name: ${{ steps.branch.outputs.name }}
          update_deployment_triggers: "true"
          environment_variables: |
            {
              "AUTHPROTO_EXTERNAL_DOMAIN": "https://${{ '${{RAILWAY_PUBLIC_DOMAIN}}' }}",
              "LIBSQL_URL": "file:/tmp/preview.db"
            }

      - name: Comment with preview URL
        env:
          PREVIEW_DOMAIN: ${{ steps.railway-deploy.outputs.service_domain }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- railway-preview -->';
            const envName = 'pr-${{ github.event.pull_request.number }}';
            const domain = process.env.PREVIEW_DOMAIN;
            if (!domain) throw new Error('Railway did not return a preview domain');
            const previewUrl = new URL(`https://${domain}`);
            if (!previewUrl.hostname.endsWith('.up.railway.app')) {
              throw new Error('Unexpected Railway domain');
            }


            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const body = `${marker}\n## 🪿 🪿 🪿 Preview environment for **${envName}** is ready! 🪿 🪿 🪿\nTake a gander: ${previewUrl}`;

            const existingComment = comments.find(comment => comment.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    environment: preview-cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine cleanup branch
        id: branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "name=railway-preview/pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=${HEAD_REF}" >> "$GITHUB_OUTPUT"
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check mirrored preview branch
        id: preview_branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup Railway Environment
        if: steps.branch.outputs.is_fork != 'true' || steps.preview_branch.outputs.exists == 'true'
        uses: ayungavis/railway-preview-deploy@8f821daf4bab3ba5bfd0e8b9d3408aed202610d7 # v2.0.0
        with:
          railway_api_token: ${{ secrets.RAILWAY_TOKEN }}
          project_id: ${{ vars.RAILWAY_PROJECT_ID }}
          environment_name: "preview-deploy"
          preview_environment_name: "pr-${{ github.event.pull_request.number }}"
          branch_name: ${{ steps.branch.outputs.name }}
          cleanup: "true"

      - name: Delete preview branch (fork)
        if: steps.branch.outputs.is_fork == 'true' && steps.preview_branch.outputs.exists == 'true'
        run: |
          git push origin --delete railway-preview/pr-${{ github.event.pull_request.number }} || true
